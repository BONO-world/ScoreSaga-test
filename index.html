<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#dc2626">
<title>ScoreSaga · ระบบจัดการทัวร์นาเมนต์</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#fff; --bg2:#fef2f2; --red:#dc2626; --txt:#111827; --muted:#6b7280;
  --bd:#fecaca; --surf:#fff; --surf2:#fef9f9; --green:#16a34a;
}
html,body{background:var(--bg2);color:var(--txt);font-family:'Kanit',sans-serif;}
body{min-height:100vh;}
.mono{font-family:'JetBrains Mono',monospace;}

#root{max-width:520px;margin:0 auto;background:var(--bg);min-height:100vh;position:relative;
  padding-bottom:calc(80px + env(safe-area-inset-bottom));box-shadow:0 0 40px rgba(220,38,38,.06);}

::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:8px;}

button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input{font-family:inherit;}

/* animations */
@keyframes rise{from{transform:translateY(14px);opacity:0;}to{transform:translateY(0);opacity:1;}}
@keyframes pop{0%{transform:scale(.6);opacity:0;}60%{transform:scale(1.1);}100%{transform:scale(1);opacity:1;}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
@keyframes slideup{from{transform:translateY(100%);}to{transform:translateY(0);}}
@keyframes fadein{from{opacity:0;}to{opacity:1;}}

.rise{animation:rise .35s ease both;}
.pop{animation:pop .4s ease both;}
.pulse{animation:pulse 1.4s ease-in-out infinite;}
.float{animation:float 3s ease-in-out infinite;}
.shake{animation:shake .4s ease;}

/* header */
.hdr{display:flex;align-items:center;gap:12px;padding:16px 16px 12px;position:sticky;top:0;z-index:40;
  background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);}
.hlogo{width:40px;height:40px;border-radius:12px;background:var(--bg2);border:1px solid var(--bd);
  display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;flex-shrink:0;}
.hlogo img{width:100%;height:100%;object-fit:cover;}
.hinfo{flex:1;min-width:0;}
.hinfo .nm{font-weight:700;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hinfo .nm input{font-weight:700;font-size:15px;border:none;border-bottom:1px dashed var(--bd);background:transparent;width:100%;color:var(--txt);}
.hinfo .sb{font-size:10px;color:var(--muted);letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.adbtn{font-size:11px;padding:7px 11px;border-radius:20px;background:#f3f4f6;color:var(--muted);font-weight:600;white-space:nowrap;}
.adbtn.on{background:var(--red);color:#fff;}

/* content */
.wrap{padding:16px;}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px;}
.card.s2{background:var(--surf2);}

/* hero */
.hero{text-align:center;padding:24px 16px;background:linear-gradient(160deg,#fff,#fef2f2);border:1px solid var(--bd);border-radius:22px;margin-bottom:14px;}
.hero .lg{width:84px;height:84px;border-radius:50%;background:#fff;border:3px solid var(--red);margin:0 auto 12px;
  display:flex;align-items:center;justify-content:center;font-size:38px;overflow:hidden;box-shadow:0 8px 24px rgba(220,38,38,.18);}
.hero .lg img{width:100%;height:100%;object-fit:cover;}
.hero h1{font-size:22px;font-weight:700;}
.hero .sub{font-size:11px;color:var(--muted);letter-spacing:1px;margin-top:2px;}
.hero .dt{display:inline-block;margin-top:10px;font-size:12px;color:var(--red);background:#fff;border:1px solid var(--bd);padding:5px 14px;border-radius:20px;font-weight:600;}
.hero .badge{display:inline-block;margin-top:8px;margin-left:6px;font-size:12px;background:var(--red);color:#fff;padding:5px 12px;border-radius:20px;font-weight:600;}

.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px;}
.stat{background:var(--surf);border:1px solid var(--bd);border-radius:16px;padding:14px 8px;text-align:center;}
.stat .v{font-size:24px;font-weight:700;color:var(--red);}
.stat .l{font-size:10px;color:var(--muted);margin-top:2px;}

.secttl{font-weight:700;font-size:15px;margin:4px 0 10px;display:flex;align-items:center;gap:6px;}

/* match strip */
.strip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;}
.mcard{flex:0 0 200px;background:var(--surf);border:1px solid var(--bd);border-radius:16px;padding:12px;}
.mcard.tap{cursor:pointer;transition:transform .1s;}
.mcard.tap:active{transform:scale(.97);}
.mcard .stg{font-size:10px;color:var(--muted);font-weight:500;}
.mcard .row{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:13px;}
.mcard .row .tn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mcard .sc{font-weight:700;font-family:'JetBrains Mono',monospace;}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.mtime{font-size:10px;color:var(--muted);margin-top:7px;}

.bdg{font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;}
.bdg.live{background:var(--red);color:#fff;}
.bdg.done{background:#dcfce7;color:var(--green);}
.bdg.sched{background:#f3f4f6;color:var(--muted);}

/* champion banner */
.champ{display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(120deg,#fffbeb,#fef2f2);
  border:2px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px;font-weight:700;font-size:17px;}
.champ .ti{font-size:26px;}

/* pills */
.pills{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.pill{padding:8px 16px;border-radius:20px;background:#f3f4f6;font-size:13px;font-weight:600;color:var(--muted);}
.pill.on{background:var(--red);color:#fff;}

/* table */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:10px;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--bd);}
th.c,td.c{text-align:center;}
td{padding:9px 4px;border-bottom:1px solid #f7e3e3;}
tr.q td{background:var(--bg2);}
tr.q td:first-child{box-shadow:inset 3px 0 0 var(--red);}
.rank{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;border-radius:6px;font-size:11px;font-weight:700;background:#f3f4f6;color:var(--muted);}
tr.q .rank{background:var(--red);color:#fff;}
.tname{display:flex;align-items:center;gap:7px;font-weight:500;}
.form{display:flex;gap:3px;margin-top:3px;}
.fdot{width:7px;height:7px;border-radius:50%;}
.fw{background:var(--green);}.fl{background:var(--red);}.fd{background:#d1d5db;}

/* fixtures */
.rndhd{font-size:11px;color:var(--red);font-weight:700;margin:14px 0 8px;display:flex;justify-content:space-between;}
.rndhd .dt{color:var(--muted);font-weight:400;}
.fix{display:flex;align-items:center;gap:8px;padding:10px;background:var(--surf);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;font-size:13px;}
.fix.tap{cursor:pointer;}.fix.tap:active{transform:scale(.99);}
.fix .h{flex:1;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fix .a{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fix .mid{font-family:'JetBrains Mono',monospace;font-weight:700;min-width:48px;text-align:center;font-size:14px;}
.fix .mid small{font-family:'Kanit';font-weight:400;font-size:11px;color:var(--muted);}

/* bracket */
.bwrap{overflow-x:auto;padding-bottom:8px;}
.bgrid{position:relative;min-width:480px;}
.bcols{display:grid;grid-template-columns:145px 145px 145px;gap:10px;position:relative;z-index:2;}
.bsvg{position:absolute;inset:0;z-index:1;width:100%;height:100%;}
.bcolhd{font-size:10px;color:var(--muted);font-weight:600;text-align:center;margin-bottom:8px;}
.bcol{display:flex;flex-direction:column;justify-content:space-around;}
.bcard{background:var(--surf);border:1px solid var(--bd);border-radius:12px;padding:8px;margin:6px 0;font-size:11px;}
.bcard.tap{cursor:pointer;}.bcard.tap:active{transform:scale(.97);}
.bcard .st{font-size:9px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:5px;}
.bcard .br{display:flex;align-items:center;gap:5px;padding:2px 0;}
.bcard .br .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);}
.bcard .br.win .nm{color:var(--txt);font-weight:600;}
.bcard .br .s{font-family:'JetBrains Mono',monospace;font-weight:700;}
.thirdrow{margin-top:14px;}

/* admin team list */
.tlist .ti{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f7e3e3;}
.tlist .ti:last-child{border-bottom:none;}
.sw{width:14px;height:14px;border-radius:5px;flex-shrink:0;}
.tlist .nm{flex:1;}
.tlist .nm b{font-weight:600;font-size:14px;}
.tlist .nm small{display:block;font-size:11px;color:var(--muted);}
.ibtn{font-size:11px;padding:6px 10px;border-radius:9px;background:#f3f4f6;color:var(--muted);font-weight:600;}
.ibtn.del{background:#fee2e2;color:var(--red);}
.fld{margin-bottom:12px;}
.fld label{font-size:11px;color:var(--muted);font-weight:600;display:block;margin-bottom:5px;}
.fld input{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;font-size:14px;background:var(--surf2);color:var(--txt);}
.fld input[type=color]{padding:2px;height:42px;}
.btn{display:block;width:100%;padding:12px;border-radius:12px;background:var(--red);color:#fff;font-weight:700;font-size:14px;text-align:center;}
.btn.g{background:#f3f4f6;color:var(--muted);}
.btn.danger{background:#fee2e2;color:var(--red);}
.btn.sm{padding:9px;font-size:13px;width:auto;display:inline-block;padding-left:16px;padding-right:16px;}
.headrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}

/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:50;max-width:520px;margin:0 auto;
  background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid var(--bd);
  display:grid;grid-template-columns:repeat(4,1fr);padding:8px 4px calc(8px + env(safe-area-inset-bottom));}
.nbtn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;font-size:10px;color:var(--muted);font-weight:600;}
.nbtn .ic{font-size:20px;}
.nbtn.on{color:var(--red);}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(17,24,39,.5);backdrop-filter:blur(4px);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;animation:fadein .2s ease;}
.ov.center{align-items:center;}
.sheet{width:100%;max-width:520px;background:#fff;border-radius:22px 22px 0 0;padding:20px;animation:slideup .25s ease;}
.modal{width:calc(100% - 40px);max-width:420px;background:#fff;border-radius:20px;padding:22px;animation:pop .3s ease;}
.ov.pin{z-index:80;}
.ov.modalov{z-index:70;}

.shhd{font-size:13px;color:var(--muted);text-align:center;margin-bottom:14px;}
.scoreedit{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0 18px;}
.team-box{text-align:center;flex:1;}
.team-box .csq{width:34px;height:34px;border-radius:9px;margin:0 auto 6px;}
.team-box .tnm{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.scnums{display:flex;align-items:center;gap:8px;}
.scbig{font-size:46px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--red);min-width:46px;text-align:center;}
.scvs{color:var(--muted);font-size:20px;}
.stbtn{width:38px;height:38px;border-radius:11px;background:var(--bg2);border:1px solid var(--bd);color:var(--red);font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.quickrow{display:flex;gap:10px;margin-bottom:14px;}
.quickrow .btn{font-size:12px;padding:10px;}
.statuspills{display:flex;gap:8px;margin-bottom:16px;}
.spill{flex:1;text-align:center;padding:10px;border-radius:12px;background:#f3f4f6;color:var(--muted);font-size:12px;font-weight:600;border:2px solid transparent;}
.spill.on.sched{background:#fff;border-color:var(--muted);color:var(--txt);}
.spill.on.live{background:var(--red);color:#fff;}
.spill.on.done{background:#dcfce7;color:var(--green);border-color:var(--green);}

/* pin */
.pinmodal{width:calc(100% - 40px);max-width:340px;background:#fff;border-radius:22px;padding:26px 22px;animation:pop .3s ease;text-align:center;}
.pinmodal.shake{animation:shake .4s ease;}
.pintitle{font-weight:700;font-size:17px;}
.pinsub{font-size:12px;color:var(--muted);margin-top:3px;margin-bottom:18px;}
.pindots{display:flex;justify-content:center;gap:14px;margin-bottom:18px;}
.pindot{width:14px;height:14px;border-radius:50%;border:2px solid var(--bd);}
.pindot.f{background:var(--red);border-color:var(--red);}
.pinerr{color:var(--red);font-size:12px;font-weight:600;margin-bottom:12px;min-height:16px;}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.numpad button{height:54px;border-radius:14px;background:var(--bg2);border:1px solid var(--bd);font-size:22px;font-weight:600;color:var(--txt);}
.numpad button:active{background:var(--bd);}
.numpad button.empty{background:transparent;border:none;cursor:default;}

.row2{display:flex;gap:10px;}.row2 .btn{flex:1;}
.tip{font-size:11px;color:var(--muted);text-align:center;margin-top:6px;}
.cpv{width:42px;height:42px;border-radius:10px;border:1px solid var(--bd);}
.colorrow{display:flex;gap:10px;align-items:center;}
.colorrow input[type=color]{flex:1;}
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";

/* ---------- helpers ---------- */
function rrFixtures(teamIds){
  const arr=[...teamIds];
  if(arr.length%2) arr.push(null);
  const rounds=[];
  for(let r=0;r<arr.length-1;r++){
    const pairs=[];
    for(let i=0;i<arr.length/2;i++){
      if(arr[i]&&arr[arr.length-1-i]) pairs.push([arr[i],arr[arr.length-1-i]]);
    }
    rounds.push(pairs);
    const last=arr.splice(arr.length-1,1)[0];
    arr.splice(1,0,last);
  }
  return rounds;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---------- default teams ---------- */
const DEFAULT_TEAMS=[
  ['โยธา ยูไนเต็ด','YOT','#dc2626','A'],['เครื่องกล บูลส์','MEC','#ea580c','A'],['ไฟฟ้า ธันเดอร์','ELE','#ca8a04','A'],['คอมพ์ ไซเบอร์','COM','#0284c7','A'],['เคมี ดราก้อน','CHE','#7c3aed','A'],
  ['อุตสาหการ อีเกิล','IND','#16a34a','B'],['สิ่งแวดล้อม กรีน','ENV','#0891b2','B'],['เกษตร แรปเตอร์','AGR','#65a30d','B'],['สำรวจ สไตรค์','SUR','#db2777','B'],['โลหการ ไอรอน','MET','#64748b','B'],
  ['ENFC ออริจินัล','ENF','#dc2626','C'],['ปี 1 ร็อคกี้','Y1','#f97316','C'],['ปี 2 สตอร์ม','Y2','#2563eb','C'],['ปี 3 ไนต์ฮอว์ก','Y3','#6366f1','C'],['ปี 4 ไฟนอล','Y4','#ec4899','C'],
  ['แบล็คแบท เอฟซี','BAT','#991b1b','D'],['เรดวิงส์ ยูดี','RED','#c2410c','D'],['สตีลเมน','STL','#475569','D'],['ทอร์นาโด','TOR','#0369a1','D'],['ฟีนิกซ์','PHX','#b45309','D'],
].map((t,i)=>({id:'t'+(i+1),name:t[0],short:t[1],color:t[2],group:t[3]}));

const GROUPS=['A','B','C','D'];
const STORE='scoresaga_v2';
const DATES=['18 ก.ค.','19 ก.ค.','20 ก.ค.','21 ก.ค.','22 ก.ค.','23 ก.ค.','24 ก.ค.','25 ก.ค.','26 ก.ค.'];

/* ---------- App ---------- */
class App{
  constructor(){
    this.state={
      tab:'home',admin:false,adminPin:'1234',showPin:false,pinInput:'',pinError:false,
      name:'นายช่างใหญ่คัพ #10',sub:'ENGINEER FOOTBALL CLUB · KKU',dateRange:'18–27 ก.ค. 2026',
      logo:'',teams:JSON.parse(JSON.stringify(DEFAULT_TEAMS)),results:{},kres:{},
      group:'A',adminGroup:'all',sheet:null,teamForm:null,
    };
    this.load();
    this.bind();
    this.render();
  }
  load(){
    try{
      const raw=localStorage.getItem(STORE);
      if(raw){
        const d=JSON.parse(raw);
        ['name','sub','dateRange','logo','adminPin','teams','results','kres'].forEach(k=>{
          if(d[k]!==undefined) this.state[k]=d[k];
        });
      }
    }catch(e){}
  }
  save(){
    const s=this.state;
    const d={name:s.name,sub:s.sub,dateRange:s.dateRange,logo:s.logo,adminPin:s.adminPin,teams:s.teams,results:s.results,kres:s.kres};
    try{localStorage.setItem(STORE,JSON.stringify(d));}catch(e){}
  }
  set(p){Object.assign(this.state,p);this.render();}

  /* ---------- data computations ---------- */
  teamsIn(g){return this.state.teams.filter(t=>t.group===g);}
  team(id){return this.state.teams.find(t=>t.id===id);}
  groupRounds(g){return rrFixtures(this.teamsIn(g).map(t=>t.id));}
  matchId(g,ri,pi){return g+'_'+ri+'_'+pi;}

  standings(g){
    const teams=this.teamsIn(g);
    const tab={};
    teams.forEach(t=>tab[t.id]={id:t.id,name:t.name,P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0,form:[]});
    const rounds=this.groupRounds(g);
    rounds.forEach((pairs,ri)=>{
      pairs.forEach((pr,pi)=>{
        const r=this.state.results[this.matchId(g,ri,pi)];
        if(!r||r.status!=='done')return;
        const [h,a]=pr;const hs=+r.hs,as=+r.as;
        const H=tab[h],A=tab[a];if(!H||!A)return;
        H.P++;A.P++;H.GF+=hs;H.GA+=as;A.GF+=as;A.GA+=hs;
        if(hs>as){H.W++;A.L++;H.Pts+=3;H.form.push('W');A.form.push('L');}
        else if(hs<as){A.W++;H.L++;A.Pts+=3;A.form.push('W');H.form.push('L');}
        else{H.D++;A.D++;H.Pts++;A.Pts++;H.form.push('D');A.form.push('D');}
      });
    });
    const arr=Object.values(tab);
    arr.forEach(r=>r.GD=r.GF-r.GA);
    arr.sort((a,b)=>b.Pts-a.Pts||b.GD-a.GD||b.GF-a.GF||a.name.localeCompare(b.name,'th'));
    return arr;
  }
  qualifier(g,rank){const s=this.standings(g);return s[rank]?s[rank].id:null;}

  /* knockout structure */
  koDefs(){
    return [
      {key:'QF1',stage:'รอบ 8 ทีม',short:'QF1',a:()=>this.qualifier('A',0),b:()=>this.qualifier('B',1),time:'24 ก.ค. 17:00'},
      {key:'QF2',stage:'รอบ 8 ทีม',short:'QF2',a:()=>this.qualifier('C',0),b:()=>this.qualifier('D',1),time:'24 ก.ค. 19:00'},
      {key:'QF3',stage:'รอบ 8 ทีม',short:'QF3',a:()=>this.qualifier('B',0),b:()=>this.qualifier('A',1),time:'25 ก.ค. 17:00'},
      {key:'QF4',stage:'รอบ 8 ทีม',short:'QF4',a:()=>this.qualifier('D',0),b:()=>this.qualifier('C',1),time:'25 ก.ค. 19:00'},
      {key:'SF1',stage:'รอบรองชนะเลิศ',short:'SF1',a:()=>this.koWinner('QF1'),b:()=>this.koWinner('QF2'),time:'26 ก.ค. 17:00'},
      {key:'SF2',stage:'รอบรองชนะเลิศ',short:'SF2',a:()=>this.koWinner('QF3'),b:()=>this.koWinner('QF4'),time:'26 ก.ค. 19:00'},
      {key:'FINAL',stage:'ชิงชนะเลิศ',short:'FINAL',a:()=>this.koWinner('SF1'),b:()=>this.koWinner('SF2'),time:'27 ก.ค. 18:00'},
      {key:'3RD',stage:'ชิงอันดับ 3',short:'3RD',a:()=>this.koLoser('SF1'),b:()=>this.koLoser('SF2'),time:'27 ก.ค. 16:00'},
    ];
  }
  koDef(key){return this.koDefs().find(d=>d.key===key);}
  koWinner(key){
    const d=this.koDef(key);if(!d)return null;
    const r=this.state.kres[key];if(!r||r.status!=='done')return null;
    const a=d.a(),b=d.b();
    if(+r.hs>+r.as)return a;if(+r.as>+r.hs)return b;return null;
  }
  koLoser(key){
    const d=this.koDef(key);if(!d)return null;
    const r=this.state.kres[key];if(!r||r.status!=='done')return null;
    const a=d.a(),b=d.b();
    if(+r.hs>+r.as)return b;if(+r.as>+r.hs)return a;return null;
  }
  champion(){return this.koWinner('FINAL');}

  /* ---------- render ---------- */
  render(){
    const s=this.state;
    let body='';
    body+=this.renderHeader();
    if(s.tab==='home')body+=this.renderHome();
    else if(s.tab==='groups')body+=this.renderGroups();
    else if(s.tab==='bracket')body+=this.renderBracket();
    else if(s.tab==='admin')body+=this.renderAdmin();
    body+=this.renderNav();
    if(s.sheet)body+=this.renderSheet();
    if(s.teamForm)body+=this.renderTeamForm();
    if(s.showPin)body+=this.renderPin();
    document.getElementById('root').innerHTML=body;
  }

  renderHeader(){
    const s=this.state;
    const logo=s.logo?`<img src="${esc(s.logo)}">`:'⚽';
    const nameEl=s.admin
      ? `<input data-input="name" value="${esc(s.name)}">`
      : esc(s.name);
    return `<div class="hdr">
      <div class="hlogo" data-action="${s.admin?'uplogo':''}">${logo}</div>
      <div class="hinfo"><div class="nm">${nameEl}</div><div class="sb">${esc(s.sub)}</div></div>
      <button class="adbtn ${s.admin?'on':''}" data-action="${s.admin?'logout':'openpin'}">${s.admin?'แก้ไข: เปิด':'โหมดแก้ไข'}</button>
    </div>`;
  }

  renderNav(){
    const s=this.state;
    const items=[['home','🏠','หน้าหลัก'],['groups','📊','รอบกลุ่ม'],['bracket','🏆','สายแข่ง'],['admin','⚙️','จัดการ']];
    return `<div class="nav">${items.map(it=>
      `<button class="nbtn ${s.tab===it[0]?'on':''}" data-action="tab" data-tab="${it[0]}">
        <span class="ic">${it[1]}</span><span>${it[2]}</span></button>`).join('')}</div>`;
  }

  /* ---------- HOME ---------- */
  renderHome(){
    const s=this.state;
    let played=0,goals=0;
    Object.values(s.results).concat(Object.values(s.kres)).forEach(r=>{
      if(r&&r.status==='done'){played++;goals+=(+r.hs)+(+r.as);}
    });
    const logo=s.logo?`<img src="${esc(s.logo)}">`:'⚽';
    const champ=this.champion();
    const champTeam=champ?this.team(champ):null;
    // build match list
    const all=this.allMatches();
    const order={'live':0,'sched':1,'done':2};
    all.sort((a,b)=>(order[a.status]-order[b.status]));
    const strip=all.slice(0,8);
    return `<div class="wrap">
      <div class="hero rise">
        <div class="lg float">${logo}</div>
        <h1>${esc(s.name)}</h1>
        <div class="sub">${esc(s.sub)}</div>
        <div><span class="dt">${esc(s.dateRange)}</span><span class="badge">${s.teams.length} ทีม</span></div>
      </div>
      <div class="stats rise">
        <div class="stat"><div class="v">${s.teams.length}</div><div class="l">ทีมเข้าแข่ง</div></div>
        <div class="stat"><div class="v">${played}</div><div class="l">แข่งจบแล้ว</div></div>
        <div class="stat"><div class="v">${goals}</div><div class="l">ประตูรวม</div></div>
      </div>
      ${champTeam?`<div class="champ pop"><span class="ti">🏆</span><span class="dot" style="background:${esc(champTeam.color)}"></span><span>${esc(champTeam.name)}</span></div>`:''}
      <div class="secttl">⚡ กำลังแข่ง & ถัดไป</div>
      <div class="strip">${strip.map(m=>this.matchCard(m)).join('')||'<div class="tip">ยังไม่มีรายการแข่งขัน</div>'}</div>
    </div>`;
  }

  allMatches(){
    const s=this.state;const list=[];
    GROUPS.forEach(g=>{
      this.groupRounds(g).forEach((pairs,ri)=>{
        pairs.forEach((pr,pi)=>{
          const id=this.matchId(g,ri,pi);
          const r=s.results[id]||{hs:0,as:0,status:'sched'};
          list.push({kind:'group',g,ri,pi,id,home:pr[0],away:pr[1],r,
            stage:'กลุ่ม '+g+' · นัด '+(ri+1),time:DATES[ri%DATES.length]+' '+(17+pi%3)+':00',status:r.status});
        });
      });
    });
    this.koDefs().forEach(d=>{
      const r=s.kres[d.key]||{hs:0,as:0,status:'sched'};
      list.push({kind:'ko',key:d.key,stage:d.stage,short:d.short,id:d.key,
        home:d.a(),away:d.b(),r,time:d.time,status:r.status});
    });
    return list;
  }

  matchCard(m){
    const s=this.state;
    const h=m.home?this.team(m.home):null,a=m.away?this.team(m.away):null;
    const bdg=m.status==='live'?'<span class="bdg live pulse">LIVE</span>':m.status==='done'?'<span class="bdg done">จบ</span>':'<span class="bdg sched">ถัดไป</span>';
    const sc=m.status==='sched'?'<span class="sc">–</span>':`<span class="sc">${m.r.hs}-${m.r.as}</span>`;
    const tapAttr=s.admin?`data-action="openmatch" data-mk="${m.kind}" ${m.kind==='group'?`data-g="${m.g}" data-ri="${m.ri}" data-pi="${m.pi}"`:`data-key="${m.key}"`}`:'';
    return `<div class="mcard ${s.admin?'tap':''}" ${tapAttr}>
      <div class="stg" style="display:flex;justify-content:space-between;align-items:center">${esc(m.stage)} ${bdg}</div>
      <div class="row"><span class="dot" style="background:${h?h.color:'#ddd'}"></span><span class="tn">${h?esc(h.name):'รอผล'}</span>${m.status!=='sched'?`<span class="sc">${m.r.hs}</span>`:''}</div>
      <div class="row"><span class="dot" style="background:${a?a.color:'#ddd'}"></span><span class="tn">${a?esc(a.name):'รอผล'}</span>${m.status!=='sched'?`<span class="sc">${m.r.as}</span>`:''}</div>
      <div class="mtime">⏱ ${esc(m.time)}</div>
    </div>`;
  }

  /* ---------- GROUPS ---------- */
  renderGroups(){
    const s=this.state;const g=s.group;
    const st=this.standings(g);
    const rounds=this.groupRounds(g);
    let fixhtml='';
    rounds.forEach((pairs,ri)=>{
      fixhtml+=`<div class="rndhd"><span>นัดที่ ${ri+1}</span><span class="dt">${esc(DATES[ri%DATES.length])} 2026</span></div>`;
      pairs.forEach((pr,pi)=>{
        const id=this.matchId(g,ri,pi);
        const r=s.results[id]||{hs:0,as:0,status:'sched'};
        const h=this.team(pr[0]),a=this.team(pr[1]);
        const mid=r.status==='sched'?`<small>${17+pi%3}:00</small>`:`${r.hs}-${r.as}`;
        const bdg=r.status==='live'?'<span class="bdg live pulse">LIVE</span>':r.status==='done'?'<span class="bdg done">จบ</span>':'';
        const tap=s.admin?`data-action="openmatch" data-mk="group" data-g="${g}" data-ri="${ri}" data-pi="${pi}"`:'';
        fixhtml+=`<div class="fix ${s.admin?'tap':''}" ${tap}>
          <span class="h">${esc(h?h.name:'')}</span>
          <span class="dot" style="background:${h?h.color:'#ddd'}"></span>
          <span class="mid">${mid}</span>
          <span class="dot" style="background:${a?a.color:'#ddd'}"></span>
          <span class="a">${esc(a?a.name:'')}</span>
          ${bdg}
        </div>`;
      });
    });
    const rows=st.map((r,i)=>{
      const q=i<2;
      const form=r.form.slice(-4).map(f=>`<span class="fdot ${f==='W'?'fw':f==='L'?'fl':'fd'}"></span>`).join('');
      const tm=this.team(r.id);
      return `<tr class="${q?'q':''}">
        <td><span class="rank">${i+1}</span></td>
        <td><div class="tname"><span class="dot" style="background:${tm?tm.color:'#ddd'}"></span><div>${esc(r.name)}<div class="form">${form}</div></div></div></td>
        <td class="c">${r.P}</td><td class="c">${r.W}</td><td class="c">${r.L}</td>
        <td class="c">${r.GD>0?'+':''}${r.GD}</td><td class="c"><b>${r.Pts}</b></td>
      </tr>`;
    }).join('');
    return `<div class="wrap">
      <div class="pills">${GROUPS.map(gr=>`<button class="pill ${gr===g?'on':''}" data-action="group" data-g="${gr}">กลุ่ม ${gr}</button>`).join('')}</div>
      <div class="card rise">
        <div class="secttl">📊 ตารางคะแนน กลุ่ม ${g}</div>
        <table>
          <thead><tr><th>#</th><th>ทีม</th><th class="c">P</th><th class="c">W</th><th class="c">L</th><th class="c">GD</th><th class="c">Pts</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        <div class="tip">🔴 2 อันดับแรกเข้ารอบน็อคเอาท์</div>
      </div>
      <div class="card rise">
        <div class="secttl">📅 โปรแกรมการแข่งขัน</div>
        ${fixhtml}
      </div>
    </div>`;
  }

  /* ---------- BRACKET ---------- */
  renderBracket(){
    const s=this.state;
    const champ=this.champion();const champTeam=champ?this.team(champ):null;
    const qfs=['QF1','QF2','QF3','QF4'];const sfs=['SF1','SF2'];
    const svg=`<svg class="bsvg" viewBox="0 0 460 400" preserveAspectRatio="none">
      <path d="M145,50 C152,50 152,100 160,100" stroke="#fecaca" stroke-width="2" fill="none"/>
      <path d="M145,150 C152,150 152,100 160,100" stroke="#fecaca" stroke-width="2" fill="none"/>
      <path d="M145,250 C152,250 152,300 160,300" stroke="#fecaca" stroke-width="2" fill="none"/>
      <path d="M145,350 C152,350 152,300 160,300" stroke="#fecaca" stroke-width="2" fill="none"/>
      <path d="M300,100 C307,100 307,200 315,200" stroke="#fecaca" stroke-width="2" fill="none"/>
      <path d="M300,300 C307,300 307,200 315,200" stroke="#fecaca" stroke-width="2" fill="none"/>
    </svg>`;
    return `<div class="wrap">
      <div class="secttl">🏆 สายน็อคเอาท์</div>
      ${champTeam?`<div class="champ pop"><span class="ti">🏆</span><span class="dot" style="background:${esc(champTeam.color)}"></span><span>${esc(champTeam.name)}</span></div>`:'<div class="champ" style="font-size:14px;color:var(--muted)">🏆 รอผู้ชนะเลิศ</div>'}
      <div class="bwrap"><div class="bgrid">
        ${svg}
        <div class="bcols">
          <div><div class="bcolhd">รอบ 8 ทีม</div><div class="bcol">${qfs.map(k=>this.koCard(k)).join('')}</div></div>
          <div><div class="bcolhd">รอบรองฯ</div><div class="bcol" style="justify-content:space-around;height:100%">${sfs.map(k=>this.koCard(k)).join('')}</div></div>
          <div><div class="bcolhd">ชิงชนะเลิศ</div><div class="bcol" style="justify-content:center;height:100%">${this.koCard('FINAL')}</div></div>
        </div>
      </div></div>
      <div class="thirdrow">
        <div class="secttl">🥉 ชิงอันดับ 3</div>
        ${this.koCard('3RD',true)}
      </div>
    </div>`;
  }

  koCard(key,wide){
    const s=this.state;const d=this.koDef(key);
    const r=s.kres[key]||{hs:0,as:0,status:'sched'};
    const a=d.a(),b=d.b();
    const ta=a?this.team(a):null,tb=b?this.team(b):null;
    const win=this.koWinner(key);
    const bdg=r.status==='live'?'<span class="bdg live pulse">LIVE</span>':r.status==='done'?'<span class="bdg done">จบ</span>':'<span class="bdg sched">รอ</span>';
    const tap=s.admin?`data-action="openmatch" data-mk="ko" data-key="${key}"`:'';
    const rowA=`<div class="br ${win&&win===a?'win':''}"><span class="dot" style="background:${ta?ta.color:'#ddd'}"></span><span class="nm">${ta?esc(ta.name):'รอผล'}</span><span class="s">${r.status==='sched'?'–':r.hs}</span></div>`;
    const rowB=`<div class="br ${win&&win===b?'win':''}"><span class="dot" style="background:${tb?tb.color:'#ddd'}"></span><span class="nm">${tb?esc(tb.name):'รอผล'}</span><span class="s">${r.status==='sched'?'–':r.as}</span></div>`;
    return `<div class="bcard ${s.admin?'tap':''}" ${tap} ${wide?'style="margin:0"':''}>
      <div class="st"><span>${esc(d.short)}</span>${bdg}</div>
      ${rowA}${rowB}
    </div>`;
  }

  /* ---------- ADMIN ---------- */
  renderAdmin(){
    const s=this.state;
    if(!s.admin){
      return `<div class="wrap"><div class="card" style="text-align:center;padding:40px 16px">
        <div style="font-size:40px">🔒</div>
        <div class="secttl" style="justify-content:center">ต้องเข้าสู่โหมดแก้ไข</div>
        <button class="btn" data-action="openpin">ปลดล็อกด้วย PIN</button>
      </div></div>`;
    }
    const flt=s.adminGroup;
    const teams=flt==='all'?s.teams:s.teams.filter(t=>t.group===flt);
    return `<div class="wrap">
      <div class="card rise">
        <div class="secttl">⚙️ ข้อมูลทัวร์นาเมนต์</div>
        <div class="fld"><label>ชื่อรายการ</label><input data-input="name" value="${esc(s.name)}"></div>
        <div class="fld"><label>คำบรรยาย</label><input data-input="sub" value="${esc(s.sub)}"></div>
        <div class="fld"><label>ช่วงวันแข่ง</label><input data-input="dateRange" value="${esc(s.dateRange)}"></div>
        <button class="btn g sm" data-action="uplogo">🖼 อัปโหลดโลโก้</button>
      </div>
      <div class="card rise">
        <div class="headrow"><div class="secttl" style="margin:0">👥 ทีมทั้งหมด (${s.teams.length} ทีม)</div>
          <button class="ibtn" data-action="addteam">+ เพิ่มทีม</button></div>
        <div class="pills">${['all','A','B','C','D'].map(g=>`<button class="pill ${flt===g?'on':''}" data-action="adminfilter" data-g="${g}">${g==='all'?'ทั้งหมด':'กลุ่ม '+g}</button>`).join('')}</div>
        <div class="tlist">
          ${teams.map(t=>`<div class="ti">
            <span class="sw" style="background:${esc(t.color)}"></span>
            <div class="nm"><b>${esc(t.name)}</b><small>${esc(t.short)} · กลุ่ม ${esc(t.group)}</small></div>
            <button class="ibtn" data-action="editteam" data-id="${t.id}">แก้ไข</button>
            <button class="ibtn del" data-action="delteam" data-id="${t.id}">ลบ</button>
          </div>`).join('')}
        </div>
      </div>
      <div class="card s2 rise">
        <div class="secttl">🔑 เปลี่ยน PIN</div>
        <div class="fld"><input id="newpin" maxlength="4" placeholder="PIN 4 หลักใหม่" value=""></div>
        <button class="btn sm" data-action="savepin">บันทึก PIN</button>
      </div>
      <div class="card rise" style="border-color:#fecaca">
        <div class="secttl">⚠️ โซนอันตราย</div>
        <button class="btn danger" data-action="resetresults">รีเซ็ตผลการแข่งขัน</button>
      </div>
    </div>`;
  }

  /* ---------- SCORE SHEET ---------- */
  renderSheet(){
    const sh=this.state.sheet;
    let home,away,r,stage,time;
    if(sh.type==='group'){
      const pr=this.groupRounds(sh.g)[sh.ri][sh.pi];
      home=this.team(pr[0]);away=this.team(pr[1]);
      const id=this.matchId(sh.g,sh.ri,sh.pi);
      r=this.state.results[id]||{hs:0,as:0,status:'sched'};
      stage='กลุ่ม '+sh.g+' · นัด '+(sh.ri+1);time=DATES[sh.ri%DATES.length]+' '+(17+sh.pi%3)+':00';
    }else{
      const d=this.koDef(sh.key);
      home=d.a()?this.team(d.a()):null;away=d.b()?this.team(d.b()):null;
      r=this.state.kres[sh.key]||{hs:0,as:0,status:'sched'};
      stage=d.stage;time=d.time;
    }
    const hs=r.hs,as=r.as;
    return `<div class="ov" data-action="closesheet"><div class="sheet" data-stop="1">
      <div class="shhd">${esc(stage)} · ⏱ ${esc(time)}</div>
      <div class="scoreedit">
        <div class="team-box"><div class="csq" style="background:${home?home.color:'#ddd'}"></div><div class="tnm">${esc(home?home.name:'รอผล')}</div></div>
        <div class="scnums">
          <button class="stbtn" data-action="sc" data-side="h" data-d="-1">−</button>
          <span class="scbig">${hs}</span><span class="scvs">:</span><span class="scbig">${as}</span>
          <button class="stbtn" data-action="sc" data-side="a" data-d="1">+</button>
        </div>
        <div class="team-box"><div class="csq" style="background:${away?away.color:'#ddd'}"></div><div class="tnm">${esc(away?away.name:'รอผล')}</div></div>
      </div>
      <div class="quickrow">
        <button class="btn" data-action="sc" data-side="h" data-d="1">+ ประตู เจ้าบ้าน</button>
        <button class="btn g" data-action="sc" data-side="a" data-d="-1">− ประตู ทีมเยือน</button>
      </div>
      <div class="statuspills">
        <button class="spill sched ${r.status==='sched'?'on':''}" data-action="setstatus" data-st="sched">นัดต่อไป</button>
        <button class="spill live ${r.status==='live'?'on':''}" data-action="setstatus" data-st="live">● LIVE</button>
        <button class="spill done ${r.status==='done'?'on':''}" data-action="setstatus" data-st="done">จบแล้ว</button>
      </div>
      <button class="btn" data-action="closesheet">บันทึก ✓</button>
    </div></div>`;
  }

  /* ---------- TEAM FORM ---------- */
  renderTeamForm(){
    const f=this.state.teamForm;
    return `<div class="ov center modalov" data-action="closeform"><div class="modal" data-stop="1">
      <div class="secttl">${f.mode==='add'?'➕ เพิ่มทีม':'✏️ แก้ไขทีม'}</div>
      <div class="fld"><label>ชื่อทีม *</label><input data-tf="name" value="${esc(f.name)}" placeholder="ชื่อทีม"></div>
      <div class="fld"><label>ชื่อย่อ</label><input data-tf="short" value="${esc(f.short)}" placeholder="ABC"></div>
      <div class="fld"><label>สีทีม</label><div class="colorrow"><input type="color" data-tf="color" value="${esc(f.color)}"><span class="cpv" style="background:${esc(f.color)}"></span></div></div>
      <div class="fld"><label>กลุ่ม</label><div class="pills" style="margin:0">${GROUPS.map(g=>`<button class="pill ${f.group===g?'on':''}" data-action="tfgroup" data-g="${g}">กลุ่ม ${g}</button>`).join('')}</div></div>
      <div class="row2"><button class="btn g" data-action="closeform">ยกเลิก</button><button class="btn" data-action="saveteam">บันทึก</button></div>
    </div></div>`;
  }

  /* ---------- PIN ---------- */
  renderPin(){
    const s=this.state;
    const dots=[0,1,2,3].map(i=>`<span class="pindot ${i<s.pinInput.length?'f':''}"></span>`).join('');
    const keys=['1','2','3','4','5','6','7','8','9','','0','⌫'];
    return `<div class="ov center pin" data-action="closepin"><div class="pinmodal ${s.pinError?'shake':''}" data-stop="1">
      <div class="pintitle">🔒 ใส่รหัส PIN</div>
      <div class="pinsub">เข้าสู่โหมดแก้ไข</div>
      <div class="pindots">${dots}</div>
      <div class="pinerr">${s.pinError?'รหัส PIN ไม่ถูกต้อง':''}</div>
      <div class="numpad">${keys.map(k=>k===''?'<button class="empty"></button>':`<button data-action="pinkey" data-k="${k}">${k}</button>`).join('')}</div>
      <button class="btn g" data-action="closepin">ยกเลิก</button>
    </div></div>`;
  }

  /* ---------- events ---------- */
  bind(){
    document.addEventListener('click',e=>{
      const stop=e.target.closest('[data-stop]');
      const el=e.target.closest('[data-action]');
      if(!el)return;
      const a=el.dataset.action;
      // if clicking inside a stop container but the action is the overlay close, ignore
      if((a==='closesheet'||a==='closeform'||a==='closepin')&&stop&&el!==e.target.closest('.ov')){
        // action belongs to a button inside; allow only if el is the overlay itself
      }
      this.action(a,el,e);
    });
    document.addEventListener('input',e=>{
      const el=e.target;
      if(el.dataset.input){this.state[el.dataset.input]=el.value;this.save();}
      if(el.dataset.tf&&this.state.teamForm){this.state.teamForm[el.dataset.tf]=el.value;}
    });
  }

  action(a,el,e){
    const s=this.state;
    switch(a){
      case 'tab':
        if(el.dataset.tab==='admin'&&!s.admin){this.set({showPin:true,pinInput:'',pinError:false});}
        else this.set({tab:el.dataset.tab});
        break;
      case 'group':this.set({group:el.dataset.g});break;
      case 'adminfilter':this.set({adminGroup:el.dataset.g});break;
      case 'openpin':this.set({showPin:true,pinInput:'',pinError:false});break;
      case 'closepin':this.set({showPin:false,pinInput:'',pinError:false});break;
      case 'pinkey':this.pinKey(el.dataset.k);break;
      case 'logout':this.set({admin:false,tab:'home'});break;
      case 'openmatch':this.openMatch(el);break;
      case 'closesheet':if(el.classList.contains('ov')||el.classList.contains('btn')){this.save();this.set({sheet:null});}break;
      case 'sc':this.changeScore(el.dataset.side,+el.dataset.d);break;
      case 'setstatus':this.setStatus(el.dataset.st);break;
      case 'addteam':this.set({teamForm:{mode:'add',id:null,name:'',short:'',color:'#dc2626',group:'A'}});break;
      case 'editteam':{const t=this.team(el.dataset.id);this.set({teamForm:{mode:'edit',id:t.id,name:t.name,short:t.short,color:t.color,group:t.group}});}break;
      case 'delteam':this.delTeam(el.dataset.id);break;
      case 'closeform':if(el.classList.contains('ov')||el.classList.contains('btn')){this.set({teamForm:null});}break;
      case 'tfgroup':if(s.teamForm){s.teamForm.group=el.dataset.g;this.render();}break;
      case 'saveteam':this.saveTeam();break;
      case 'savepin':this.savePin();break;
      case 'resetresults':this.resetResults();break;
      case 'uplogo':this.uploadLogo();break;
    }
  }

  pinKey(k){
    const s=this.state;
    if(k==='⌫'){this.set({pinInput:s.pinInput.slice(0,-1),pinError:false});return;}
    if(s.pinInput.length>=4)return;
    const v=s.pinInput+k;
    if(v.length===4){
      if(v===s.adminPin){this.set({admin:true,tab:'admin',showPin:false,pinInput:'',pinError:false});}
      else{this.set({pinError:true,pinInput:''});}
    }else{this.set({pinInput:v,pinError:false});}
  }

  openMatch(el){
    if(!this.state.admin)return;
    if(el.dataset.mk==='group'){
      this.set({sheet:{type:'group',g:el.dataset.g,ri:+el.dataset.ri,pi:+el.dataset.pi}});
    }else{
      this.set({sheet:{type:'ko',key:el.dataset.key}});
    }
  }

  curResult(){
    const sh=this.state.sheet;
    if(sh.type==='group'){
      const id=this.matchId(sh.g,sh.ri,sh.pi);
      if(!this.state.results[id])this.state.results[id]={hs:0,as:0,status:'sched'};
      return this.state.results[id];
    }else{
      if(!this.state.kres[sh.key])this.state.kres[sh.key]={hs:0,as:0,status:'sched'};
      return this.state.kres[sh.key];
    }
  }
  changeScore(side,d){
    const r=this.curResult();
    if(side==='h')r.hs=Math.max(0,(+r.hs)+d);
    else r.as=Math.max(0,(+r.as)+d);
    if(r.status==='sched'&&(r.hs||r.as))r.status='live';
    this.save();this.render();
  }
  setStatus(st){const r=this.curResult();r.status=st;this.save();this.render();}

  delTeam(id){
    if(!confirm('ลบทีมนี้? ผลการแข่งขันที่เกี่ยวข้องอาจมีปัญหา'))return;
    this.state.teams=this.state.teams.filter(t=>t.id!==id);
    this.save();this.render();
  }
  saveTeam(){
    const f=this.state.teamForm;
    if(!f.name.trim()){alert('กรุณากรอกชื่อทีม');return;}
    if(f.mode==='add'){
      const id='t'+Date.now();
      this.state.teams.push({id,name:f.name.trim(),short:f.short.trim()||f.name.slice(0,3).toUpperCase(),color:f.color,group:f.group});
    }else{
      const t=this.team(f.id);
      if(t){t.name=f.name.trim();t.short=f.short.trim();t.color=f.color;t.group=f.group;}
    }
    this.save();this.set({teamForm:null});
  }
  savePin(){
    const inp=document.getElementById('newpin');
    const v=(inp?inp.value:'').trim();
    if(!/^\d{4}$/.test(v)){alert('PIN ต้องเป็นตัวเลข 4 หลัก');return;}
    this.state.adminPin=v;this.save();this.render();alert('บันทึก PIN ใหม่แล้ว');
  }
  resetResults(){
    if(!confirm('รีเซ็ตผลการแข่งขันทั้งหมด? ไม่สามารถย้อนกลับได้'))return;
    this.state.results={};this.state.kres={};this.save();this.render();
  }
  uploadLogo(){
    const inp=document.createElement('input');
    inp.type='file';inp.accept='image/*';
    inp.onchange=()=>{
      const file=inp.files[0];if(!file)return;
      const rd=new FileReader();
      rd.onload=()=>{this.state.logo=rd.result;this.save();this.render();};
      rd.readAsDataURL(file);
    };
    inp.click();
  }
}

window.addEventListener('DOMContentLoaded',()=>{window.app=new App();});
</script>
</body>
</html>
